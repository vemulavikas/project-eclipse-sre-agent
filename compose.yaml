services:
  dashboard:
    build: .
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PROMETHEUS_URL: http://prometheus:10000
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-local-dev-token}
      PROMETHEUS_BEARER_TOKEN: ${PROMETHEUS_BEARER_TOKEN:-local-dev-token}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - prometheus

  prometheus:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    environment:
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-local-dev-token}
      PROMETHEUS_BEARER_TOKEN: ${PROMETHEUS_BEARER_TOKEN:-local-dev-token}
      PORT: 10000
    ports:
      - "127.0.0.1:9090:10000"
